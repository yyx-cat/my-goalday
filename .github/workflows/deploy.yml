name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 为整个工作流设置权限
permissions:
  contents: write   # <-- 关键：授予写入内容的权限

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：拉取你仓库的最新代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js 环境（版本 20）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # 缓存依赖，加速构建

      # 步骤 3：安装项目依赖（相当于在本地执行 npm install）
      - name: Install dependencies
        run: npm ci  # npm ci 比 npm install 更快更稳定，专门给自动构建用的

      # 步骤 4：打包项目（相当于在本地执行 npm run build）
      - name: Build project
        run: npm run build

      # 步骤 5：将打包好的 dist 文件夹部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # GitHub 自动提供的密钥，用来往你的仓库推送代码
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 要上传的文件夹路径（Vite 打包后生成 dist）
          publish_dir: ./dist